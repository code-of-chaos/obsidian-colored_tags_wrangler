#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "CI: Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.1 or 1.0.1-BETA-1)"
        required: true
        type: string
      prerelease:
        description: "Is this a pre-release?"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-BETA-*"

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    name: "CI: resolve"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - name: Resolve version from trigger
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ inputs.prerelease }}" >> $GITHUB_OUTPUT
            echo "tag_name=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Tag push - extract version from tag
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
            # Detect BETA in version
            if [[ "$VERSION" == *"-BETA-"* ]]; then
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi

  validate:
    name: "CI: validate"
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-BETA-[0-9]+)?$ ]]; then
            echo "Error: Version must be in semver format (e.g., 1.0.1 or 1.0.1-BETA-1)"
            exit 1
          fi

      - name: Check version doesn't exist
        run: |
          TAG="${{ needs.resolve.outputs.tag_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: Tag $TAG already exists"
            exit 1
          fi

  test:
    name: "CI: test"
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  bump-version:
    name: "CI: bump-version"
    runs-on: ubuntu-latest
    needs: [resolve, validate, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"

          # Update package.json
          npm version "${VERSION}" --no-git-tag-version

          # Update manifest.json
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            manifest.version = '${VERSION}';
            fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 4));
          "

          # Update versions.json
          node -e "
            const fs = require('fs');
            const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            versions['${VERSION}'] = '1.13.0';
            fs.writeFileSync('versions.json', JSON.stringify(versions, null, 4));
          "

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json versions.json
          git commit -m "chore: release v${{ needs.resolve.outputs.version }}"
          git tag "${{ needs.resolve.outputs.tag_name }}"
          git push origin HEAD --tags

  publish:
    name: "CI: publish"
    runs-on: ubuntu-latest
    needs: [resolve, bump-version]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.resolve.outputs.tag_name }}"
          VERSION="${{ needs.resolve.outputs.version }}"
          IS_PRERELEASE="${{ needs.resolve.outputs.prerelease }}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release create "$TAG" \
              --title="$VERSION" \
              --prerelease \
              main.js manifest.json styles.css
          else
            gh release create "$TAG" \
              --title="$VERSION" \
              main.js manifest.json styles.css
          fi
